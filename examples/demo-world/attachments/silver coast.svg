  <text x="520" y="480" font-size="22" font-style="italic" fill="#4d7a82" letter-spacing="2">Silver Sea</text>
  <text x="250" y="232" font-size="12" font-style="italic" fill="#4d7a82" transform="rotate(18 250 232)">Silver River</text>
  <g transform="translate(752 470)" fill="#3a3226" font-size="12" text-anchor="middle">
    <path d="M0 -22 L6 0 L0 -5 L-6 0 Z"/><text y="16">N</text>
