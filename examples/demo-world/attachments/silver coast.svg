    <path d="M110 105 L170 35 L230 100 Z"/>
    <path d="M600 90 L650 40 L700 95 Z"/>
    <path d="M660 110 L715 60 L770 115 Z"/>
    <path d="M440 300 L485 235 L530 300 Z"/>
  </g>
  <!-- forests -->
  <g fill="#9fb28a" stroke="#7e9169" stroke-width="1">
