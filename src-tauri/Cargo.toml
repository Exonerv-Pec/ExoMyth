[package]
name = "exomyth"
version = "1.1.0"
description = "Exomyth for the desktop: a private, offline-first wiki for writers and worldbuilders"
authors = ["Exomyth contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/Exonerv-Pec/Exomyth"
edition = "2021"
rust-version = "1.90"

[lib]
name = "exomyth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json", "platform-verifier"] }
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
